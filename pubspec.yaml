name: wayaak_delivery
description: "A new Flutter project."

publish_to: "none"

version: 2.2.0+7

environment:
  sdk: ">=3.3.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.0.7
  shimmer: ^3.0.0
  badges: ^3.1.2
  flutter_local_notifications: ^19.5.0
  get: ^4.6.6
  intl: ^0.20.2
  pinput: ^6.0.1
  flutter_svg: ^2.0.9
  flutter_svg_provider: ^1.0.3
  carousel_slider: ^5.1.1
  permission_handler: ^12.0.1
  cached_network_image: ^3.2.3
  lottie: ^3.0.0
  intl_phone_field: ^3.2.0
  shared_preferences: ^2.2.2
  dotted_line: ^3.2.2
  google_maps_flutter: ^2.2.8
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  web_socket_channel: ^3.0.1
  location: ^8.0.1
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  flutter_rating_bar: ^4.0.1
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.0.1
  url_launcher: ^6.3.0
  http: ^1.2.2
  flutter_animarker: ^3.2.0
  # open_street_map_search_and_pick: ^0.1.1
  map_location_picker: ^3.1.0
  flutter_polyline_points: ^2.1.0
  sign_in_with_apple: ^7.0.1
  upgrader: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.6.1
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.1.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon.png"
  #  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/images/app-icon.png"


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lotties/
    - assets/locales/

  fonts:
    - family: Poppin
      fonts:
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 500
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800

dependency_overrides:
  retrofit: 4.7.0
